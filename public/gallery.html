<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — SBS Cuts</title>
<meta name="description" content="Recent work from SBS Cuts — fades, tapers, lineups, and more.">
<meta name="theme-color" content="#0D0C0B">
<link rel="canonical" href="https://sbscuts.pages.dev/gallery.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230D0C0B'/%3E%3Ctext x='50' y='69' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%237A2320' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SBS Cuts">
<meta property="og:title" content="Gallery — SBS Cuts">
<meta property="og:description" content="Recent work from SBS Cuts — fades, tapers, lineups, and more.">
<meta property="og:url" content="https://sbscuts.pages.dev/gallery.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header"></div>

<main id="main">

<section class="hero" style="padding:64px 0 52px;">
  <div class="container">
    <div class="eyebrow">Gallery</div>
    <h1 style="font-size:clamp(32px,5vw,52px);">Recent work</h1>
    <p class="lead" id="heroLine">A look at recent cuts.</p>
  </div>
</section>

<section class="section">
  <div class="container" id="galleryWrap"></div>
</section>

<section class="section center">
  <div class="container-narrow">
    <h2 style="margin-bottom:14px;">Like what you see?</h2>
    <p class="lead" style="margin:0 auto 28px;">Booking takes less than a minute.</p>
    <a href="#" class="btn btn-accent js-book" target="_blank" rel="noopener">Book Now</a>
  </div>
</section>

</main>

<div id="site-footer"></div>

<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  const S = window.SITE || {};
  const wrap = document.getElementById('galleryWrap');

  if (S.gallery && S.gallery.length) {
    const grid = document.createElement('div');
    grid.className = 'grid-3';
    S.gallery.forEach(function(g){
      const item = document.createElement('div');
      item.innerHTML = `<img src="${g.src}" alt="${g.alt || ''}" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);">`;
      grid.appendChild(item.firstElementChild);
    });
    wrap.appendChild(grid);
  } else {
    wrap.innerHTML = `
      <div class="empty-state">
        <h3>Photos coming soon</h3>
        <p>Recent work will be posted here as it's added. In the meantime, follow along on Instagram and TikTok for the latest cuts.</p>
      </div>`;
    document.getElementById('heroLine').textContent = 'Photos are on the way — check back soon, or follow along on social media.';
  }

  const social = S.social || {};
  if (social.instagram || social.tiktok) {
    const links = document.createElement('div');
    links.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin-top:24px;justify-content:center;';
    if (social.instagram) links.innerHTML += `<a href="${social.instagram}" target="_blank" rel="noopener" class="btn btn-outline btn-small">Instagram</a>`;
    if (social.tiktok) links.innerHTML += `<a href="${social.tiktok}" target="_blank" rel="noopener" class="btn btn-outline btn-small">TikTok</a>`;
    if (!S.gallery || !S.gallery.length) {
      links.style.marginTop = '24px';
      wrap.appendChild(links);
    }
  }
})();
</script>
</body>
</html>
