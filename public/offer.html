<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First-Time Offer — SBS Cuts</title>
<meta name="description" content="Details on the current new-client offer at SBS Cuts.">
<meta name="theme-color" content="#0D0C0B">
<link rel="canonical" href="/offer.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230D0C0B'/%3E%3Ctext x='50' y='69' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%237A2320' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="hero" style="padding:64px 0 52px;">
  <div class="container">
    <div class="eyebrow">Offer</div>
    <h1 id="offerHeadline" style="font-size:clamp(32px,5vw,52px);">First 3 New Clients: One Service Free</h1>
    <p class="lead" id="offerStatusLine"></p>
  </div>
</section>

<section class="section" id="offerBody">
  <!-- Filled in by script below depending on offer.active in config.js -->
</section>

<section class="section section-alt center">
  <div class="container-narrow">
    <h2 style="margin-bottom:14px;">Ready to book?</h2>
    <p class="lead" style="margin:0 auto 28px;">Booking takes less than a minute.</p>
    <a href="#" class="btn btn-accent js-book" target="_blank" rel="noopener">Book Now</a>
  </div>
</section>

<div id="site-footer"></div>

<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  const S = window.SITE;
  const offer = S.offer || {};
  document.getElementById('offerHeadline').textContent = offer.headline || 'First 3 New Clients: One Service Free';
  const body = document.getElementById('offerBody');
  const statusLine = document.getElementById('offerStatusLine');

  if (offer.active) {
    statusLine.innerHTML = '<strong style="color:var(--accent-hi);">Currently active.</strong>';
    body.innerHTML = `
      <div class="container-narrow">
        <div class="card">
          <p class="lead" style="margin-bottom:0;">${offer.terms || '[Terms not yet confirmed]'}</p>
        </div>
      </div>`;
  } else {
    statusLine.innerHTML = 'This offer is <span class="ph" title="Placeholder — confirm status">not currently confirmed as active</span>.';
    body.innerHTML = `
      <div class="container-narrow">
        <div class="card" style="border-style:dashed;">
          <p class="lead" style="margin-bottom:12px;">
            <span class="ph-note">Placeholder</span> This page exists so the offer has a home once it's confirmed, but it is not being promoted anywhere on the site yet.
          </p>
          <p class="lead" style="margin-bottom:0;color:var(--muted);font-size:14px;">
            To turn it on: set <code>offer.active</code> to <code>true</code> in <code>/assets/config.js</code> and fill in the exact terms — which service qualifies, any restrictions, and how a client claims it. It will then also appear as a banner on the Home page automatically.
          </p>
        </div>
      </div>`;
  }
})();
</script>
</body>
</html>
