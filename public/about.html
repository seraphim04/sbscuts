<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Seraphim Davis — SBS Cuts</title>
<meta name="description" content="Meet Seraphim Davis, the barber and entrepreneur behind SBS Cuts in Norfolk, VA — his background, values, and approach behind the chair.">
<meta name="theme-color" content="#0D0C0B">
<link rel="canonical" href="https://sbscuts.pages.dev/about.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230D0C0B'/%3E%3Ctext x='50' y='69' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%237A2320' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SBS Cuts">
<meta property="og:title" content="About Seraphim Davis — SBS Cuts">
<meta property="og:description" content="The barber and entrepreneur behind SBS Cuts — background, values, and approach behind the chair.">
<meta property="og:url" content="https://sbscuts.pages.dev/about.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header"></div>

<main id="main">

<section class="hero" style="padding:64px 0 52px;">
  <div class="container">
    <div class="eyebrow">About</div>
    <h1 style="font-size:clamp(32px,5vw,52px);">Behind the chair</h1>
    <p class="lead" id="heroLine"></p>
  </div>
</section>

<section class="section">
  <div class="container grid-2" style="align-items:start;" id="storyGrid">
    <div id="portraitSlot"></div>
    <div id="storyCol">
      <h2 style="margin-bottom:18px;">The story</h2>
      <div id="bioParagraphs"></div>
      <div class="card" style="margin-top:28px;">
        <div class="hero-meta" style="margin-top:0;gap:32px;">
          <div>
            <strong>Cutting Since</strong>
            <span id="sinceLine"></span>
          </div>
          <div>
            <strong>Experience</strong>
            <span id="experienceLine"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section section-alt center">
  <div class="container-narrow">
    <h2 style="margin-bottom:14px;">Come see for yourself</h2>
    <p class="lead" style="margin:0 auto 28px;">Booking takes less than a minute.</p>
    <a href="#" class="btn btn-accent js-book" target="_blank" rel="noopener">Book Now</a>
  </div>
</section>

</main>

<div id="site-footer"></div>

<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  const S = window.SITE || {};

  document.getElementById('heroLine').textContent = S.experienceLine || '';
  document.getElementById('sinceLine').textContent = S.founded || '';
  document.getElementById('experienceLine').textContent = S.experienceLine || '';

  const bioWrap = document.getElementById('bioParagraphs');
  (S.bioFull || []).forEach(function(p){
    const el = document.createElement('p');
    el.className = 'lead';
    el.style.marginBottom = '16px';
    el.textContent = p;
    bioWrap.appendChild(el);
  });

  // Portrait — hidden entirely (story column expands full-width) until a
  // real photo is configured.
  const portraitSlot = document.getElementById('portraitSlot');
  if (S.barberPhoto) {
    portraitSlot.innerHTML = `<img src="${S.barberPhoto}" alt="${S.barberName || 'The barber'} at SBS Cuts" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);">`;
  } else {
    portraitSlot.remove();
    document.getElementById('storyGrid').style.gridTemplateColumns = '1fr';
    document.getElementById('storyCol').style.maxWidth = '68ch';
  }
})();
</script>
</body>
</html>
