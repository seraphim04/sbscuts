<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews — SBS Cuts</title>
<meta name="description" content="What clients say about SBS Cuts in Norfolk, VA.">
<meta name="theme-color" content="#0D0C0B">
<link rel="canonical" href="https://sbscuts.pages.dev/reviews.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230D0C0B'/%3E%3Ctext x='50' y='69' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%237A2320' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SBS Cuts">
<meta property="og:title" content="Reviews — SBS Cuts">
<meta property="og:description" content="What clients say about SBS Cuts in Norfolk, VA.">
<meta property="og:url" content="https://sbscuts.pages.dev/reviews.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header"></div>

<main id="main">

<section class="hero" style="padding:64px 0 52px;">
  <div class="container">
    <div class="eyebrow">Reviews</div>
    <h1 style="font-size:clamp(32px,5vw,52px);">What clients say</h1>
    <p class="lead" id="heroLine">Client reviews live on the TheCut booking profile.</p>
    <div class="hero-ctas">
      <a href="#" id="theCutLink" class="btn btn-accent" target="_blank" rel="noopener">View Reviews on TheCut</a>
    </div>
  </div>
</section>

<section class="section" id="reviewsSection">
  <div class="container" id="reviewsWrap"></div>
</section>

<section class="section section-alt center">
  <div class="container-narrow">
    <h2 style="margin-bottom:14px;">Ready to book?</h2>
    <p class="lead" style="margin:0 auto 28px;">Booking takes less than a minute.</p>
    <a href="#" class="btn btn-accent js-book" target="_blank" rel="noopener">Book Now</a>
  </div>
</section>

</main>

<div id="site-footer"></div>

<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  const S = window.SITE || {};
  document.getElementById('theCutLink').setAttribute('href', S.bookingUrl || '#');

  const wrap = document.getElementById('reviewsWrap');
  if (S.reviews && S.reviews.length) {
    const grid = document.createElement('div');
    grid.className = 'grid-3';
    S.reviews.forEach(function(r){
      const card = document.createElement('div');
      card.className = 'card review-card';
      card.innerHTML = `
        <span class="stars">${'★'.repeat(r.rating || 5)}</span>
        <p class="quote">"${r.quote}"</p>
        <div class="who">— ${r.name}</div>`;
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  } else {
    wrap.innerHTML = `
      <div class="empty-state">
        <h3>No reviews posted here yet</h3>
        <p>Client reviews are collected through the TheCut booking profile — take a look there, and check back here as reviews are added.</p>
      </div>`;
  }
})();
</script>
</body>
</html>
